<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任務機｜怪怪整理師</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="assets/brand/logo-wordmark.png" alt="怪怪整理師 Wacky Tidy Pals" class="logo-img">
  </header>

  <section class="hero">
    <h1 class="hero-title">透過任務機<br>你可以更了解怪怪整理師！</h1>
    <p class="hero-desc">整理小隊正在待命！試著問問角色個性、品牌故事，或任何你的好奇。</p>
  </section>

  <main>
    <div id="chat-messages" role="log" aria-live="polite"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="問問整理小隊任何問題…" autocomplete="off" maxlength="200">
      <button id="send-btn" aria-label="送出"><span id="btn-label">出發 →</span></button>
    </div>
  </main>

  <section class="cta-section">
    <p class="cta-text">還想知道更多？</p>
    <a class="btn-site" href="https://wackytidypals.framer.media/" target="_blank" rel="noopener">前往官方網站 ↗</a>
  </section>

  <footer>
    <p>© 2026 MixCode Studio. All rights reserved. ｜ 怪怪整理師 Wacky Tidy Pals</p>
  </footer>

  <!-- Markdown 渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
